    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        margin: 0;
      }
      .font-official { font-family: 'Amiri', serif; }

      @media print {
        @page {
          size: A4 portrait;
          margin: 6mm; 
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body {
          background: #ffffff !important;
          color: #000000 !important;
          height: auto !important;
          min-height: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        /* Hide non-printable elements */
        header, footer, nav, button, .no-print, .print\:hidden {
          display: none !important;
          visibility: hidden !important;
        }

        /* If body is printing report or has modal overlay, hide dashboard background */
        body.is-printing-report #root > div > *:not(.printable-modal-overlay),
        body:has(.printable-modal-overlay) #root > div > *:not(.printable-modal-overlay) {
          display: none !important;
        }

        /* Modal Overlay covers page cleanly in print */
        .printable-modal-overlay {
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          width: 100% !important;
          height: 100% !important;
          min-height: 100vh !important;
          background: #ffffff !important;
          z-index: 999999 !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: visible !important;
          display: block !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          transform: none !important;
        }

        /* Printable Area styles */
        .printable-area {
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          display: block !important;
          visibility: visible !important;
        }

        .printable-area * {
          visibility: visible !important;
        }

        table {
          page-break-inside: auto;
        }
        tr {
          page-break-inside: avoid;
          page-break-after: auto;
        }
        thead {
          display: table-header-group;
        }
        tfoot {
          display: table-footer-group;
        }
      }
    </style>
