    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        margin: 0;
      }
      .font-official { font-family: 'Amiri', serif; }

      /* كود الطباعة الاحترافي */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0; /* نلغي هوامش المتصفح الافتراضية */
        }
        
        /* إخفاء كل شيء في الموقع */
        body * {
          visibility: hidden;
        }

        /* إظهار حاوية الطباعة فقط وتثبيتها في الصفحة */
        .printable-area, .printable-area * {
          visibility: visible;
        }

        .printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 210mm;
          height: 297mm;
          background: white !important;
          margin: 0 !important;
          padding: 15mm !important; /* الهامش الرسمي للمستند */
          box-sizing: border-box;
        }

        /* منع المتصفح من إضافة روابط أو تواريخ تلقائية */
        header, footer, .no-print {
          display: none !important;
        }
      }
    </style>
